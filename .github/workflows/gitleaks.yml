# Secret scan with gitleaks-action. @v3 follows the action's releases, and each release brings its own
# gitleaks version: nothing to bump here. No GITLEAKS_LICENSE: this repo belongs to a personal account.
# An organization repo needs a free key from gitleaks.io.
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write # the action comments on the PR line with a finding

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
