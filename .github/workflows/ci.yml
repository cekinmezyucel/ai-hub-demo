name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t ai-hub-demo .

  # "Production" in v0: run the image inside this job and smoke check it. No registry, no host.
  smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, image]
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Build image
        run: docker build -t ai-hub-demo .
      - name: Start app
        run: docker run -d --name app -p 8080:8080 ai-hub-demo
      - name: Wait for /health
        run: timeout 60 sh -c 'until curl -fs "$BASE_URL/health"; do sleep 1; done'
      - name: Smoke checks
        run: pytest smoke -v
      - name: App logs
        if: always()
        run: docker logs app
      - name: Stop app
        if: always()
        run: docker rm -f app
